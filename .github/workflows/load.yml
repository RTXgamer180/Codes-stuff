name: Generate Item Gallery

on:
  push:
    paths-ignore:
      - "item-gallery.json"
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  generate-gallery:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate Item Gallery
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import quote

          REPOSITORY = "RTXgamer180/Codes-stuff"
          BRANCH = "main"

          items = []

          print("Scanning repository for PNG files...")

          for file in Path(".").rglob("*"):
              if not file.is_file():
                  continue

              if ".git" in file.parts:
                  continue

              if file.suffix.lower() != ".png":
                  continue

              # Skip recipe images, since they aren't item textures.
              if "recipe" in file.stem.lower():
                  continue

              relative_path = file.as_posix()

              # Convert filename into a readable display name.
              name = file.stem
              name = name.replace("_", " ")
              name = name.replace("-", " ")
              name = " ".join(name.split()).title()

              # Preserve the original repository path.
              encoded_path = "/".join(
                  quote(part, safe="")
                  for part in relative_path.split("/")
              )

              texture_url = (
                  f"https://raw.githubusercontent.com/"
                  f"{REPOSITORY}/{BRANCH}/{encoded_path}"
              )

              items.append({
                  "name": name,
                  "texture": texture_url,
                  "path": relative_path
              })

              print(f"Found: {name} ({relative_path})")

          items.sort(key=lambda item: item["name"].lower())

          output = Path("item-gallery.json")

          with output.open("w", encoding="utf-8") as file:
              json.dump(items, file, indent=2, ensure_ascii=False)

          print()
          print(f"Successfully generated {len(items)} entries!")
          print(f"Output: {output}")
          PY

      - name: Commit Generated Gallery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add item-gallery.json

          if git diff --cached --quiet; then
            echo "No gallery changes detected."
          else
            git commit -m "Automatically update item gallery"
            git push
          fi
