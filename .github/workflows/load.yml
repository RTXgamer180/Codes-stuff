name: Generate Item Gallery

on:
  push:
    paths-ignore:
      - "item-gallery.json"
      - "item-gallery.html"
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate-gallery:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate Gallery Files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import quote
          from html import escape

          REPOSITORY = "RTXgamer180/Codes-stuff"
          BRANCH = "main"

          items = []

          print("Scanning all folders for PNG textures...")

          for file in Path(".").rglob("*"):
              if not file.is_file():
                  continue

              if ".git" in file.parts:
                  continue

              if file.suffix.lower() != ".png":
                  continue

              if "recipe" in file.stem.lower():
                  continue

              relative_path = file.as_posix()

              name = file.stem.replace("_", " ").replace("-", " ")
              name = " ".join(name.split()).title()

              encoded_path = "/".join(
                  quote(part, safe="")
                  for part in relative_path.split("/")
              )

              texture_url = (
                  f"https://raw.githubusercontent.com/"
                  f"{REPOSITORY}/{BRANCH}/{encoded_path}"
              )

              items.append({
                  "name": name,
                  "texture": texture_url,
                  "path": relative_path
              })

              print("Found:", name)

          items.sort(key=lambda item: item["name"].lower())

          Path("item-gallery.json").write_text(
              json.dumps(items, indent=2, ensure_ascii=False),
              encoding="utf-8"
          )

          cards = []

          for item in items:
              cards.append(f'''
              <article class="item">
                <img src="{escape(item["texture"], quote=True)}"
                     alt="{escape(item["name"], quote=True)}"
                     loading="lazy">
                <h3>{escape(item["name"])}</h3>
              </article>
              ''')

          html = f'''<!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Codes Cool Mod - Item Gallery</title>
            <style>
              * {{ box-sizing: border-box; }}
              body {{
                margin: 0;
                padding: 24px;
                background: #111318;
                color: #f4f4f5;
                font-family: Arial, sans-serif;
              }}
              header {{
                text-align: center;
                margin-bottom: 28px;
              }}
              h1 {{ color: #a78bfa; }}
              #search {{
                display: block;
                width: min(100%, 480px);
                margin: 20px auto;
                padding: 13px;
                border-radius: 10px;
                border: 1px solid #444;
                background: #20232b;
                color: white;
                font-size: 16px;
              }}
              #count {{ color: #aaa; }}
              .gallery {{
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 14px;
                max-width: 1100px;
                margin: auto;
              }}
              .item {{
                background: #20232b;
                border: 1px solid #353945;
                border-radius: 12px;
                padding: 14px;
                text-align: center;
              }}
              .item img {{
                width: 100%;
                max-width: 100px;
                height: 100px;
                object-fit: contain;
                image-rendering: pixelated;
              }}
              .item h3 {{
                font-size: 14px;
                overflow-wrap: anywhere;
              }}
              footer {{
                text-align: center;
                margin-top: 35px;
                color: #888;
              }}
            </style>
          </head>
          <body>
            <header>
              <h1>Codes Cool Mod</h1>
              <p>Complete automatically generated item gallery</p>
              <input id="search" placeholder="Search items...">
              <p id="count">{len(items)} items found</p>
            </header>

            <main class="gallery" id="gallery">
              {''.join(cards)}
            </main>

            <footer>
              Generated automatically from the Codes Cool Mod repository.
            </footer>

            <script>
              const search = document.getElementById("search");
              const cards = [...document.querySelectorAll(".item")];
              const count = document.getElementById("count");

              search.addEventListener("input", () => {{
                const query = search.value.toLowerCase();
                let visible = 0;

                cards.forEach(card => {{
                  const matches = card.textContent.toLowerCase().includes(query);
                  card.hidden = !matches;
                  if (matches) visible++;
                }});

                count.textContent = visible + " items found";
              }});
            </script>
          </body>
          </html>'''

          Path("item-gallery.html").write_text(html, encoding="utf-8")

          print(f"Generated gallery with {len(items)} items.")
          PY

      - name: Commit Generated Files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add item-gallery.json item-gallery.html

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update automatic item gallery"
            git push
          fi

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
